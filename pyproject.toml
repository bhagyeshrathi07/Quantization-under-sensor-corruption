[project]
name = "qflip"
version = "0.0.1"
description = "Paired BF16-vs-INT4 flip analysis of a driving VLM on DriveBench"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pillow>=10",
    "pyyaml>=6",
    "tqdm>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["huggingface_hub>=0.25", "gdown>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
